plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingStoreFile = System.getenv("KEYSTORE_FILE")
def signingStorePassword = System.getenv("KEYSTORE_PASSWORD")
def signingKeyAlias = System.getenv("KEY_ALIAS")
def signingKeyPassword = System.getenv("KEY_PASSWORD")
def releaseSigningReady = signingStoreFile != null && !signingStoreFile.isEmpty() &&
        file(signingStoreFile).exists() &&
        signingStorePassword != null && !signingStorePassword.isEmpty() &&
        signingKeyAlias != null && !signingKeyAlias.isEmpty() &&
        signingKeyPassword != null && !signingKeyPassword.isEmpty()

android {
    namespace 'com.wusper.sensorblocker'
    compileSdk 35

    defaultConfig {
        applicationId "com.wusper.sensorblocker"
        minSdk 26
        targetSdk 35
        versionCode 104
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ["en", "zh", "zh-rCN", "zh-rTW"]
    }


    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding false
        buildConfig true
        aidl true
    }

    packaging {
        resources {
            excludes += [
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE.txt",
                "META-INF/LICENSE",
                "META-INF/NOTICE",
                "META-INF/androidx/**",
                "META-INF/*.version",
                "okhttp3/internal/publicsuffix/*"
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    testImplementation 'junit:junit:4.13.2'
}
